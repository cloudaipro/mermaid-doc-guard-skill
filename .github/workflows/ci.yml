name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test skills/mermaid-doc-guard/scripts/validate-mermaid.test.mjs
      - name: Check validator CLI
        run: node skills/mermaid-doc-guard/scripts/validate-mermaid.mjs --help
      - name: Run renderer integration check
        run: node skills/mermaid-doc-guard/scripts/validate-mermaid.mjs skills/mermaid-doc-guard/SKILL.md skills/mermaid-doc-guard/references/mermaid-safe-patterns.md
